<main class="demo">
  <h1>{{ title() }}</h1>
  <p class="demo__hint">
    Both cards render the UC-1 reference payload as a value-proportional Sankey
    diagram — light and dark themes from the same data, zero consumer config.
  </p>

  <section class="demo__grid">
    <article class="demo__card demo__card--light">
      <h2>Light theme</h2>
      <allomoney-sankey-diagram [dataSource]="data()" theme="light" />
    </article>

    <article class="demo__card demo__card--dark">
      <h2>Dark theme</h2>
      <allomoney-sankey-diagram [dataSource]="data()" theme="dark" />
    </article>
  </section>
</main>
