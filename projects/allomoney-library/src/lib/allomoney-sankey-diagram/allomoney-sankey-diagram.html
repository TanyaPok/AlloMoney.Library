@if (isEmpty()) {
    <div class="allomoney-sankey__empty"
         role="status"
         aria-live="polite"
         [attr.aria-label]="noDataMessage()">
        <div class="allomoney-sankey__empty-art" aria-hidden="true">{{ noDataMessage() }}</div>
    </div>
} @else {
    @let view = layout()!;
    <div class="allomoney-sankey__scroll">
    <svg class="allomoney-sankey__canvas"
         [attr.viewBox]="'0 0 ' + view.width + ' ' + view.height"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-label="Sankey diagram of money flows"
         [attr.aria-describedby]="descId"
         (pointermove)="onTooltipMove($event)"
         (click)="clearSelection()">
        <desc [id]="descId">{{ summary() }}</desc>

        <!-- Link ribbons. Decorative for AT — the flows are exposed as real text
             in the visually-hidden list below. Hovering a ribbon highlights its
             chain and dims the others. When link editing is enabled each ribbon
             becomes a keyboard-operable button and is no longer AT-hidden. -->
        <g class="allomoney-sankey__links"
           [attr.aria-hidden]="linkEditingEnabled() ? null : true">
            @for (link of renderLinks(); track link.id) {
                <path class="allomoney-sankey__link"
                      [class.allomoney-sankey--dim]="link.dimmed"
                      [class.allomoney-sankey__link--selected]="link.selected"
                      [class.allomoney-sankey__link--editable]="linkEditingEnabled()"
                      [attr.role]="linkEditingEnabled() ? 'button' : null"
                      [attr.tabindex]="linkEditingEnabled() ? 0 : null"
                      [attr.aria-label]="linkEditingEnabled() ? link.editLabel : null"
                      [attr.d]="link.path"
                      [style.fill]="link.color"
                      [style.--allomoney-selected-color]="link.color"
                      (pointerenter)="onHoverLink(link, $event)"
                      (pointerleave)="onLeave()"
                      (click)="toggleSelectLink(link, $event)"
                      (dblclick)="startLinkEdit(link)"
                      (keydown.enter)="startLinkEdit(link)"
                      (keydown.f2)="startLinkEdit(link)"/>
            }
        </g>

        <!-- Nodes + labels. Labels are bound via interpolation (auto-escaped);
             never innerHTML — node/link names are untrusted. Each node group is
             hoverable and dims when another chain is highlighted. When editing is
             enabled the group becomes a keyboard-operable button and is no
             longer hidden from assistive tech. -->
        <g class="allomoney-sankey__nodes"
           [attr.aria-hidden]="editingEnabled() ? null : true">
            @for (node of renderNodes(); track node.id) {
                <g class="allomoney-sankey__node"
                   [class.allomoney-sankey--dim]="node.dimmed"
                   [class.allomoney-sankey__node--selected]="node.selected"
                   [class.allomoney-sankey__node--editable]="editingEnabled() && !node.ghost"
                   [attr.role]="editingEnabled() && !node.ghost ? 'button' : null"
                   [attr.tabindex]="editingEnabled() && !node.ghost ? 0 : null"
                   [attr.aria-label]="editingEnabled() && !node.ghost ? node.editLabel : null"
                   (pointerenter)="onHoverNode(node.id, $event)"
                   (pointerleave)="onLeave()"
                   (click)="toggleSelectNode(node.id, $event)"
                   (dblclick)="startEdit(node.id)"
                   (keydown.enter)="startEdit(node.id)"
                   (keydown.f2)="startEdit(node.id)">
                    <!-- A ghost node is a phantom cycle duplicate: drawn as a
                         border-only outline in its original's color, no fill. -->
                    <rect class="allomoney-sankey__node-rect"
                          [class.allomoney-sankey__node-rect--ghost]="node.ghost"
                          [attr.x]="node.x"
                          [attr.y]="node.y"
                          [attr.width]="node.width"
                          [attr.height]="node.height"
                          rx="3"
                          [style.fill]="node.ghost ? 'none' : node.color"
                          [style.stroke]="node.ghost ? node.color : null"
                          [style.--allomoney-selected-color]="node.color"/>
                    <text class="allomoney-sankey__node-label"
                          [attr.x]="node.labelX"
                          [attr.y]="node.labelY"
                          [attr.text-anchor]="node.labelAnchor"
                          dominant-baseline="middle">
                        {{ node.label }}
                    </text>
                </g>
            }
        </g>

        <!-- Per-flow value labels, drawn on top of the ribbons. -->
        <g class="allomoney-sankey__link-labels" aria-hidden="true">
            @for (link of renderLinks(); track link.id) {
                <text class="allomoney-sankey__link-value"
                      [class.allomoney-sankey--dim]="link.dimmed"
                      [class.allomoney-sankey__link-value--editable]="linkEditingEnabled()"
                      [attr.x]="link.labelX"
                      [attr.y]="link.labelY"
                      text-anchor="middle"
                      dominant-baseline="middle"
                      (pointerenter)="onHoverLink(link, $event)"
                      (pointerleave)="onLeave()"
                      (click)="toggleSelectLink(link, $event)"
                      (dblclick)="startLinkEdit(link)">
                    {{ link.valueLabel }}
                </text>
            }
        </g>

        <!-- Node edit overlay (UC-3): an in-place form drawn over the edited node.
             Native <input>s inside <foreignObject> keep it keyboard- and
             AT-accessible. ENTER or focus leaving the overlay commits; Esc/Cancel
             discards. -->
        @if (nodeEditView(); as edit) {
            <foreignObject [attr.x]="edit.x"
                           [attr.y]="edit.y"
                           [attr.width]="edit.width"
                           [attr.height]="edit.height">
                <div class="allomoney-sankey__edit"
                     role="dialog"
                     aria-label="Edit node"
                     (keydown.enter)="commitEdit()"
                     (keydown.escape)="cancelEdit()"
                     (focusout)="onEditFocusOut($event)">
                    @if (canEditNodeName()) {
                        <label class="allomoney-sankey__edit-field">
                            <span class="allomoney-sankey__edit-label">Name</span>
                            <input #nameInput
                                   class="allomoney-sankey__edit-input"
                                   type="text"
                                   [value]="edit.seedName"/>
                        </label>
                    }
                    @if (canEditNodeValue()) {
                        <label class="allomoney-sankey__edit-field">
                            <span class="allomoney-sankey__edit-label">Value</span>
                            <input #valueInput
                                   class="allomoney-sankey__edit-input"
                                   type="text"
                                   inputmode="decimal"
                                   [value]="edit.seedValue"
                                   [attr.aria-invalid]="edit.error ? true : null"/>
                        </label>
                    }
                    @if (edit.error) {
                        <p class="allomoney-sankey__edit-error" role="alert">{{ edit.error }}</p>
                    }
                    <div class="allomoney-sankey__edit-actions">
                        <button type="button"
                                class="allomoney-sankey__edit-btn allomoney-sankey__edit-btn--primary"
                                (click)="commitEdit()">
                            Save
                        </button>
                        <button type="button"
                                class="allomoney-sankey__edit-btn"
                                (click)="cancelEdit()">
                            Cancel
                        </button>
                    </div>
                </div>
            </foreignObject>
        }

        <!-- Link edit overlay (UC-4): value <input> plus source/target <select>s
             populated from the existing nodes. Same commit/cancel semantics as
             the node overlay. -->
        @if (linkEditView(); as edit) {
            <foreignObject [attr.x]="edit.x"
                           [attr.y]="edit.y"
                           [attr.width]="edit.width"
                           [attr.height]="edit.height">
                <div class="allomoney-sankey__edit"
                     role="dialog"
                     aria-label="Edit flow"
                     (keydown.enter)="commitEdit()"
                     (keydown.escape)="cancelEdit()"
                     (focusout)="onEditFocusOut($event)">
                    @if (canEditLinkSource()) {
                        <label class="allomoney-sankey__edit-field">
                            <span class="allomoney-sankey__edit-label">Source</span>
                            <select #sourceSelect class="allomoney-sankey__edit-input">
                                @for (opt of edit.nodes; track opt.id) {
                                    <option [value]="opt.id" [selected]="opt.id === edit.source">{{ opt.label }}</option>
                                }
                            </select>
                        </label>
                    }
                    @if (canEditLinkTarget()) {
                        <label class="allomoney-sankey__edit-field">
                            <span class="allomoney-sankey__edit-label">Target</span>
                            <select #targetSelect class="allomoney-sankey__edit-input">
                                @for (opt of edit.nodes; track opt.id) {
                                    <option [value]="opt.id" [selected]="opt.id === edit.target">{{ opt.label }}</option>
                                }
                            </select>
                        </label>
                    }
                    @if (linkValueEditable()) {
                        <label class="allomoney-sankey__edit-field">
                            <span class="allomoney-sankey__edit-label">Value</span>
                            <input #linkValueInput
                                   class="allomoney-sankey__edit-input"
                                   type="text"
                                   inputmode="decimal"
                                   [value]="edit.seedValue"
                                   [attr.aria-invalid]="edit.error ? true : null"/>
                        </label>
                    }
                    @if (edit.error) {
                        <p class="allomoney-sankey__edit-error" role="alert">{{ edit.error }}</p>
                    }
                    <div class="allomoney-sankey__edit-actions">
                        <button type="button"
                                class="allomoney-sankey__edit-btn allomoney-sankey__edit-btn--primary"
                                (click)="commitEdit()">
                            Save
                        </button>
                        <button type="button"
                                class="allomoney-sankey__edit-btn"
                                (click)="cancelEdit()">
                            Cancel
                        </button>
                    </div>
                </div>
            </foreignObject>
        }
    </svg>
    </div>

    <!-- Custom hover tooltip. Themed with the component (data-theme), it tracks
         the pointer and flips near the host edges. Nodes show only their value;
         links show source, target, and value on separate rows. Purely visual
         (aria-hidden) — the same information is exposed to AT via the node/link
         labels and the visually-hidden list below. -->
    @if (tooltipView(); as tip) {
        <div class="allomoney-sankey__tooltip"
             [class.allomoney-sankey__tooltip--flip-x]="tip.flipX"
             [class.allomoney-sankey__tooltip--flip-y]="tip.flipY"
             [style.left.px]="tip.x"
             [style.top.px]="tip.y"
             role="tooltip"
             aria-hidden="true">
            @for (row of tip.rows; track $index) {
                <div class="allomoney-sankey__tooltip-row">
                    @if (row.label) {
                        <span class="allomoney-sankey__tooltip-label">{{ row.label }}</span>
                    }
                    <span class="allomoney-sankey__tooltip-value">{{ row.value }}</span>
                </div>
            }
        </div>
    }

    <!-- Text alternative: the flows as a visually-hidden list so information is
         not conveyed by color/position alone. -->
    <ul class="allomoney-sankey__sr-only">
        @for (link of view.links; track link.id) {
            <li>{{ link.a11yLabel }}</li>
        }
    </ul>
}
